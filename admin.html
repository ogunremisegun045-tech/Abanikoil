.brand{position:absolute;z-index:1;left:20px;bottom:16px;display:flex;align-items:center;gap:12px}
.brand b{display:block;font:800 22px/1.1 system-ui;color:var(--y);letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:13px;color:#e8e8ea}

.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#0f1013;overflow:hidden}
.in span{padding:0 14px;color:var(--y);font-weight:700;font-size:18px}
input{flex:1;min-width:0;padding:14px 14px 14px 0;border:0;background:none;color:var(--fg);font:600 20px system-ui;outline:none}

.pw{border:1px solid var(--line);border-radius:12px;background:#0f1013}
.in:focus-within,.pw:focus-within{border-color:var(--y)}
.rem{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:14px;font-weight:400}
.rem input{flex:none;width:18px;height:18px;padding:0}
button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:12px;background:var(--y);color:#1a1a1a;font:800 17px system-ui;cursor:pointer}

.msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px;display:none}
.msg.ok{display:block;background:#12301c;color:#7be59a}
.msg.bad{display:block;background:#3a1717;color:#ff9b9b}
.back{display:block;text-align:center;margin-top:18px;color:var(--mut);font-size:14px}

<script>
/* The Apps Script web app link (same one used in index.html) */
var API="https://script.google.com/macros/s/AKfycbxOzPh4ns_TpMR9LNSWlqlbY-h0BJ2TAwxbjPOn1gtATU9KqJfCX5IQc8u1JALkcsXk/exec";
var KEYS=["pms","ago","lpg"];
function $(i){return document.getElementById(i)}
function say(t,ok){var m=$("msg");m.textContent=t;m.className="msg "+(ok?"ok":"bad")}
try{var saved=localStorage.getItem("abanik_pw");if(saved){$("pw").value=saved;$("rem").checked=true}}catch(e){}

fetch(API+"?t="+Date.now()).then(function(r){return r.json()}).then(function(d){
  KEYS.forEach(function(k){if(d[k])$(k).value=d[k]})
}).catch(function(){say("Could not load the current prices. Check your internet and refresh.",false)});

$("save").onclick=function(){
  var body={pw:$("pw").value},i,v;
  if(!body.pw){say("Please enter your password.",false);return}
  for(i=0;i<KEYS.length;i++){
    v=parseFloat(String($(KEYS[i]).value).replace(/[^0-9.]/g,""));
    if(!(v>0)){say("Enter a valid price for every fuel.",false);return}
    body[KEYS[i]]=v}
  var b=$("save");b.disabled=true;b.textContent="Saving…";$("msg").className="msg";
  fetch(API,{method:"POST",body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
    if(d&&d.ok){
      KEYS.forEach(function(k){if(d.prices&&d.prices[k])$(k).value=d.prices[k]});
      try{if($("rem").checked)localStorage.setItem("abanik_pw",body.pw);else localStorage.removeItem("abanik_pw")}catch(e){}
      say("Saved. The website now shows the new prices.",true)
    }else say("Wrong password. Please try again.",false)
  }).catch(function(){say("Could not save. Check your internet and try again.",false)})
  .then(function(){b.disabled=false;b.textContent="Save prices"})
};
</script>
</body>
</html>
